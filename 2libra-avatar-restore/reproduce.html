<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2libra 头像原样恢复 - 本地复现验证</title>
<style>
  body { font: 14px/1.6 sans-serif; padding: 24px; }
  .row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 16px; }
  .case { border: 1px solid #ddd; padding: 12px; border-radius: 8px; }
  .case h3 { margin: 0 0 8px; font-size: 13px; }
  #result { margin-top: 24px; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
<h2>四种真实头像样例复现（样式与站点一致）</h2>

<div class="row">
  <div class="case">
    <h3>1. 模糊的（blur + saturate + scale）</h3>
    <div id="blur-root" class="relative leading-none [&amp;_img]:block [&amp;_canvas]:block " style="min-width: 2.625rem; width: 2.625rem; height: 2.625rem; position: relative;"><div id="blur-inner" class="bg-base-100 shadow-xs" style="border-radius: 0.5rem; overflow: hidden; width: 2.625rem; height: 2.625rem; filter: blur(2px) saturate(0.85); transform: scale(1.04);"><div style="position: relative; width: 2.625rem; height: 2.625rem;"><canvas id="blur-canvas" style="width: 2.625rem; height: 2.625rem; border-radius: 0.5rem; display: block;" width="227" height="227"></canvas><img id="blur-img" alt="ikun9527" width="42" height="42" decoding="async" data-nimg="1" src="https://r2.2libra.com/avatars/f59e/520b/42cc6a02-5e8e-4ebe-890f-e22818d9003e.gif?t=1791851237646" style="border-radius: 0.5rem; position: absolute; inset: 0px; width: 100%; height: 100%; object-fit: cover; display: none;"></div></div></div>
  </div>

  <div class="case">
    <h3>2. 偏移的（drop-shadow + rotateY 透视）</h3>
    <div id="offset-root" class="relative leading-none [&amp;_img]:block [&amp;_canvas]:block " style="width: 2.875rem; height: 2.875rem; min-width: 2.875rem; position: relative; filter: drop-shadow(rgba(0, 0, 0, 0.22) -5.1px 3px 2px) drop-shadow(rgba(0, 0, 0, 0.28) -10.2px 8px 9px); transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1); will-change: filter;"><div id="offset-inner" class="bg-base-100 shadow-xs" style="border-radius: 0.5rem; overflow: hidden; width: 2.875rem; height: 2.875rem; transform: perspective(300px) rotateY(-26.1deg); transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1); background-color: transparent; box-shadow: none; will-change: transform; backface-visibility: hidden;"><img id="offset-img" alt="vhxubo" width="46" height="46" decoding="async" data-nimg="1" src="https://r2.2libra.com/cdn-cgi/image/width=256,height=256,fit=cover,format=auto/avatars/4bcd/2c8a/e9dce99a-160c-40ab-9404-dda483d13fd3.png?t=1790685068092" style="color: transparent; width: fit-content; border-radius: 0.5rem; opacity: 1;"></div></div>
  </div>

  <div class="case">
    <h3>3. 大小缩放的（avatar-shrink-hover）</h3>
    <div class="relative leading-none [&amp;_img]:block [&amp;_canvas]:block " style="min-width: 2.625rem; width: 2.625rem; height: 2.625rem; position: relative;"><div id="shrink-inner" class="avatar-shrink-hover bg-base-100 shadow-xs" style="border-radius: 0.5rem; overflow: hidden; width: 2.625rem; height: 2.625rem; background-color: transparent; box-shadow: none;"><img alt="LittlePisces" width="42" height="42" decoding="async" data-nimg="1" src="https://r2.2libra.com/cdn-cgi/image/width=256,height=256,fit=cover,format=auto/avatars/51d0/85eb/85ad9210-7daf-497b-83db-d019a287f6ea.jpg?t=1785199835678" style="color: transparent; width: fit-content; border-radius: 0.5rem; opacity: 1;"></div></div>
  </div>

  <div class="case">
    <h3>4. 旋转的（canvas 绘制 + img 隐藏）</h3>
    <div class="relative leading-none [&amp;_img]:block [&amp;_canvas]:block " style="min-width: 2.625rem; width: 2.625rem; height: 2.625rem; position: relative;"><div class="bg-base-100 shadow-xs" style="border-radius: 0.5rem; overflow: hidden; width: 2.625rem; height: 2.625rem;"><div style="position: relative; width: 2.625rem; height: 2.625rem;"><canvas id="rot-canvas" style="width: 2.625rem; height: 2.625rem; border-radius: 0.5rem; display: block;" width="256" height="256"></canvas><img id="rot-img" alt="libra2" width="42" height="42" decoding="async" data-nimg="1" src="https://r2.2libra.com/cdn-cgi/image/width=256,height=256,fit=cover,format=auto/avatars/3884/16ba/35fa0850-132c-4932-ba6e-ca9faa95eab9.gif?t=1782957817341" style="color: transparent; border-radius: 0.5rem; position: absolute; inset: 0px; width: 100%; height: 100%; object-fit: cover; display: none;"></div></div></div>
  </div>
</div>

<!-- 加载脚本本体（纯 IIFE，无 GM 依赖也能在页面环境运行） -->
<script src="2libra-avatar-restore.user.js"></script>
<script>
  // 等 rAF 节流的 sweep 跑完后收集计算样式
  setTimeout(() => {
    const cs = (id) => getComputedStyle(document.getElementById(id));
    const checks = [
      ['blur 内层 filter 还原', cs('blur-inner').filter === 'none', cs('blur-inner').filter],
      ['blur 内层 transform 还原', cs('blur-inner').transform === 'none', cs('blur-inner').transform],
      ['blur canvas 隐藏', cs('blur-canvas').display === 'none', cs('blur-canvas').display],
      ['blur 原图显示', cs('blur-img').display === 'block', cs('blur-img').display],
      ['offset 外层 drop-shadow 移除', cs('offset-root').filter === 'none', cs('offset-root').filter],
      ['offset 内层 rotateY 移除', cs('offset-inner').transform === 'none', cs('offset-inner').transform],
      ['offset will-change 还原', cs('offset-inner').willChange === 'auto', cs('offset-inner').willChange],
      ['offset backface-visibility 还原', cs('offset-inner').backfaceVisibility === 'visible', cs('offset-inner').backfaceVisibility],
      ['offset transition 还原', cs('offset-inner').transitionDuration === '0s', cs('offset-inner').transitionDuration],
      ['缩放类名已摘除', !document.getElementById('shrink-inner').classList.contains('avatar-shrink-hover'), document.getElementById('shrink-inner').className],
      ['旋转 canvas 隐藏', cs('rot-canvas').display === 'none', cs('rot-canvas').display],
      ['旋转原图显示', cs('rot-img').display === 'block', cs('rot-img').display],
    ];
    const failed = checks.filter(([, pass]) => !pass);
    const lines = checks.map(([name, pass, actual]) => `${pass ? '✓' : '✗'} ${name}${pass ? '' : '（实际: ' + actual + '）'}`);
    lines.push(failed.length ? `\n结果：失败 ${failed.length} 项` : '\n结果：全部通过');
    const el = document.getElementById('result');
    el.textContent = lines.join('\n');
    el.style.background = failed.length ? '#fee' : '#efe';
    window.__ALL_PASS = failed.length === 0;
  }, 200);
</script>
<div id="result">运行中…</div>
</body>
</html>
